name: Checkmarx One Scan

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main

permissions:
  contents: read

jobs:
  checkmarx-scan:
    name: Checkmarx One Security Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkmarx One Scan
        uses: checkmarx/ast-github-action@8e887bb93dacc44e0f5b64ee2b06d5815f89d4fc
        with:
          base_uri: "https://ind.ast.checkmarx.net"
          cx_client_id: rakshu
          cx_client_secret: Ye7C6EA2DA6IxPFnCVm79TVECTXZrMH8iOg924GE2cMlfzVegx848rJCVGD915LolzLUs1ooA7mED7Jn8QQzgw
          cx_tenant: cx_ind_internal_test

          # Scan configuration
          additional_params: >-
            --scan-types sast
            --sast-incremental
            --base-branch main

      - name: Upload SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: cx_result.sarif
